<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Registros</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Lista de Personas Registradas</h1>
        <a href="/" class="button-link" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff;">← Volver al Registro</a>
        
        <table>
            <thead>
                <tr>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for registro in registros %}
                <tr>
                    <td>{{ registro[1] }}</td> <!-- dni -->
                    <td>{{ registro[2] }}</td> <!-- nombre -->
                    <td>{{ registro[3] }}</td> <!-- apellido -->
                    <td>{{ registro[4] }}</td> <!-- direccion -->
                    <td>{{ registro[5] }}</td> <!-- telefono -->
                    <td>
                        <!-- Formulario para eliminar (Método POST) -->
                        <form action="/eliminar/{{ registro[1] }}" method="POST" style="display:inline;">
                            <button type="submit" style="background-color: #dc3545; padding: 5px 10px;" onclick="return confirm('¿Estás seguro de eliminar este registro?');">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" style="text-align: center;">No hay registros disponibles.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
