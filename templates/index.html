<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <main class="container">
        <div class="card">
            <h1>📝 Registro de Personal</h1>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Complete el formulario para añadir un nuevo registro a la base de datos.</p>
                <a href="/administrar" class="btn btn-secondary">📊 Ver Registros</a>
            </div>

            <form action="/registrar" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dni">DNI / Documento</label>
                        <input type="text" id="dni" name="dni" class="form-input" required placeholder="Ej: 12345678">
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-input" required placeholder="Ej: Juan">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-input" required placeholder="Ej: Pérez">
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" class="form-input" placeholder="Ej: Av. Principal 123">
                    </div>
                    <div class="form-group" style="grid-column: span 1;">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" name="telefono" class="form-input" placeholder="Ej: +51 987 654 321">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">✅ Registrar Persona</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Modal de Éxito (Se activa automáticamente si Flask envía el mensaje) -->
    {% if mensaje_confirmacion %}
    <div id="successModal" class="modal active">
        <div class="modal-content">
            <button class="close-btn" onclick="cerrarModal()">&times;</button>
            <div style="font-size: 2.5rem; margin-bottom: 10px;">🎉</div>
            <h2 style="color: var(--success); margin-bottom: 8px;">¡Registro Exitoso!</h2>
            <p>{{ mensaje_confirmacion }}</p>
            <button class="btn btn-primary" onclick="cerrarModal()" style="width: 100%;">Aceptar</button>
        </div>
    </div>
    {% endif %}

    <script>
        function cerrarModal() {
            const modal = document.getElementById('successModal');
            if (modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300); // Elimina del DOM tras animación
            }
        }

        // Cierre automático tras 3 segundos
        window.addEventListener('load', () => {
            const modal = document.getElementById('successModal');
            if (modal) setTimeout(cerrarModal, 3000);
        });
    </script>
</body>
</html>
